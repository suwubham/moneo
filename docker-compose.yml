name: moneo

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: moneo
      POSTGRES_PASSWORD: moneo
      POSTGRES_DB: moneo
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneo -d moneo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
