language: en-GB
tone_instructions: "Plain and short. Lead with real bugs, security and privacy problems. Skip nits that eslint and tsc catch."
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  poem: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/package-lock.json"
    - "!apps/*/public/**"
    - "!apps/app/drizzle/meta/**"
  path_instructions:
    - path: "apps/app/lib/modules/**/repository.ts"
      instructions: "Every query must filter by the signed-in user's id. Flag any read or write that could touch another user's rows."
    - path: "apps/app/lib/modules/assistant/**"
      instructions: "Tools close over the user id; the model must never choose whose data it reads. Tools stay read-only. User text and transaction descriptions are data, never instructions. Flag prompt changes that invite investment, tax or legal advice."
    - path: "apps/app/lib/modules/ai/**"
      instructions: "Model output is untrusted: ids must be checked against the user's own lists, amounts and dates validated, and nothing saved without the person confirming."
    - path: "apps/app/drizzle/**"
      instructions: "Migrations must stay backward compatible with the code currently in production: add before use, drop in a later PR. Flag destructive changes."
    - path: "apps/app/lib/core/log.ts"
      instructions: "Logs must never contain personal or financial data: no names, emails, amounts, descriptions or message text."
    - path: "**/*.{ts,tsx}"
      instructions: "If a change alters what data is collected or sent to a third party, the privacy page in apps/site/app/privacy must change in the same PR."
knowledge_base:
  code_guidelines:
    enabled: true
chat:
  auto_reply: true
